name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[dev]
      # The full correctness-gate suite: multi-process gloo, world sizes 2 and 4.
      - run: python -m pytest
