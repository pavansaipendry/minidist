[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minidist"
version = "0.1.0"
description = "Data parallelism, ZeRO-1/2, and tensor parallelism from raw torch.distributed primitives"
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# Flag-proof import path: macOS occasionally stamps UF_HIDDEN on the editable
# install's .pth file and Python >=3.12 silently skips hidden .pth files
# (import minidist then fails). pytest inserting src/ itself sidesteps that.
# If module runs (python -m minidist.*) break with ModuleNotFoundError, run:
#   chflags nohidden .venv/lib/python3.12/site-packages/__editable__.minidist-0.1.0.pth
pythonpath = ["src"]
