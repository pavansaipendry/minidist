[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minidist"
version = "0.1.0"
description = "Data parallelism, ZeRO-1/2, and tensor parallelism from raw torch.distributed primitives"
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# pytest inserts src/ itself so the suite never depends on the editable
# install's .pth being processed.
pythonpath = ["src"]
